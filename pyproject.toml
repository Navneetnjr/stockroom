[project]
name = "stockroom"
version = "0.1.0"
description = "Multi-tenant inventory and order management REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "flask-limiter>=4.1.1",
    "flask-smorest>=0.47.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W = PEP 8 style, F = real mistakes, I = import order,
# B = likely bugs, UP = modern Python syntax, N = PEP 8 naming
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Migration files are generated by Alembic and may contain long SQL strings
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
# flask-smorest ships without type hints
module = ["flask_smorest", "flask_smorest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These modules use flask-smorest's untyped decorators and base classes
module = ["app.api.*", "app.errors"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
