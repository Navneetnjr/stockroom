services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      # Inside Docker the database host is the service name "db", not localhost
      DATABASE_URL: postgresql+psycopg://stockroom:stockroom@db:5432/stockroom
      REDIS_URL: redis://redis:6379/0
      # Taken from your shell/.env if set; the fallback is for local use only
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-only-secret-change-me-0123456789abcdef}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      # Local development only: real credentials come from secrets, never from git
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    ports:
      # 5433 on the laptop, because a local PostgreSQL already uses 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
