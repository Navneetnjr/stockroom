name: CI

# Run on every push to any branch, and on every pull request
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # publish the test results on the pull request
      pull-requests: write

    # A throwaway PostgreSQL that exists only while this job runs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockroom
          POSTGRES_PASSWORD: stockroom
          POSTGRES_DB: stockroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockroom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://stockroom:stockroom@localhost:5432/stockroom_test

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy strict)
        run: uv run mypy

      - name: Tests with coverage (must be at least 80%)
        run: uv run pytest --cov-fail-under=80 --junitxml=test-results.xml

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results.xml

  docker:
    name: Docker compose smoke test and image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Start the whole stack (docker compose up)
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Check the running API
        run: |
          curl --fail --silent --show-error http://localhost:8000/readyz
          curl --fail --silent --show-error --output /dev/null http://localhost:8000/openapi.json

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image (and push it on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
