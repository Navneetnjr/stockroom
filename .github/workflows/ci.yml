name: CI

# Run on every push to any branch, and on every pull request
on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL that exists only while this job runs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockroom
          POSTGRES_PASSWORD: stockroom
          POSTGRES_DB: stockroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockroom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://stockroom:stockroom@localhost:5432/stockroom_test

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy strict)
        run: uv run mypy

      - name: Tests with coverage (must be at least 80%)
        run: uv run pytest --cov-fail-under=80
